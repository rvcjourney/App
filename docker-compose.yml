version: '3.8'

services:
  # ============================================
  # BACKEND API - Node.js Express Server
  # ============================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: connectiqo-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - VIDEOSDK_API_KEY=${VIDEOSDK_API_KEY}
      - VIDEOSDK_SECRET_KEY=${VIDEOSDK_SECRET_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
    volumes:
      - ./backend:/app
      - /app/node_modules
    restart: unless-stopped
    networks:
      - connectiqo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # ============================================
  # ADMIN PANEL - React + Vite (Port 5173)
  # ============================================
  admin-panel:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: connectiqo-admin
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
      - VITE_SUPABASE_URL=${SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    volumes:
      - ./LearningPlatform:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - connectiqo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================
  # FRONTEND - React Native / Expo (Port 8081)
  # ============================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: connectiqo-frontend
    ports:
      - "8081:8081"
      - "19000:19000"
    environment:
      - API_URL=http://backend:3000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - EXPO_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - EXPO_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    volumes:
      - ./src:/app/src
      - ./app.json:/app/app.json
      - ./package.json:/app/package.json
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - connectiqo-network

networks:
  connectiqo-network:
    driver: bridge
