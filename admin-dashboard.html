<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnEasy Admin Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            color: #667eea;
            font-size: 28px;
        }

        header .status {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .status-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .status-item .label {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
        }

        .status-item .value {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .config {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .config h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .config-input {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .config-input input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .config-input button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .config-input button:hover {
            background: #5568d3;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .card-content {
            color: #666;
            line-height: 1.6;
        }

        .card-number {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            margin: 10px 0;
        }

        .withdrawals {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .withdrawals h2 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .withdrawal-item {
            background: #f9f9f9;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            border-left: 4px solid #667eea;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .withdrawal-info {
            flex: 1;
        }

        .withdrawal-info .teacher-name {
            font-weight: bold;
            color: #333;
        }

        .withdrawal-info .amount {
            color: #667eea;
            font-size: 18px;
            margin: 5px 0;
        }

        .withdrawal-info .status {
            color: #999;
            font-size: 12px;
        }

        .withdrawal-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .btn-approve {
            background: #4CAF50;
            color: white;
        }

        .btn-approve:hover {
            background: #45a049;
        }

        .btn-reject {
            background: #f44336;
            color: white;
        }

        .btn-reject:hover {
            background: #da190b;
        }

        .loading {
            text-align: center;
            color: #667eea;
            padding: 20px;
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .backend-info {
            background: white;
            padding: 15px;
            border-radius: 5px;
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }

        .backend-info.connected {
            background: #d4edda;
            color: #155724;
        }

        .backend-info.disconnected {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 LearnEasy Admin Dashboard</h1>
            <div class="status">
                <div class="status-item">
                    <div class="label">Total Revenue</div>
                    <div class="value">₹<span id="totalRevenue">0</span></div>
                </div>
                <div class="status-item">
                    <div class="label">Pending Withdrawals</div>
                    <div class="value"><span id="pendingCount">0</span></div>
                </div>
            </div>
        </header>

        <div class="config">
            <h3>🔧 Backend Configuration</h3>
            <div class="config-input">
                <input type="text" id="apiUrl" placeholder="Backend URL (e.g., http://localhost:3000)" value="http://localhost:3000">
                <button onclick="testBackend()">Test Connection</button>
            </div>
            <div id="backendStatus" class="backend-info">Checking...</div>
        </div>

        <div id="messages"></div>

        <div class="dashboard">
            <div class="card">
                <h2>📊 Analytics</h2>
                <div id="analyticsContent" class="card-content">
                    <p>Loading analytics...</p>
                </div>
            </div>

            <div class="card">
                <h2>💰 Payments</h2>
                <div id="paymentsContent" class="card-content">
                    <p>Loading payments...</p>
                </div>
            </div>

            <div class="card">
                <h2>👨‍🏫 Top Teachers</h2>
                <div id="teachersContent" class="card-content">
                    <p>Loading teachers...</p>
                </div>
            </div>
        </div>

        <div class="withdrawals">
            <h2>📤 Pending Withdrawal Requests</h2>
            <div id="withdrawalsContent">
                <p class="loading">Loading withdrawal requests...</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = () => document.getElementById('apiUrl').value;

        // Test backend connection
        async function testBackend() {
            try {
                const response = await fetch(`${API_URL()}/health`);
                const data = await response.json();
                showMessage('✅ Backend is connected and running!', 'success');
                document.getElementById('backendStatus').innerHTML = '✅ <strong>Connected</strong> - Backend is running';
                document.getElementById('backendStatus').className = 'backend-info connected';
                loadDashboard();
            } catch (error) {
                showMessage('❌ Cannot reach backend. Make sure it\'s running on ' + API_URL(), 'error');
                document.getElementById('backendStatus').innerHTML = '❌ <strong>Disconnected</strong> - Cannot reach backend at ' + API_URL();
                document.getElementById('backendStatus').className = 'backend-info disconnected';
            }
        }

        // Show message
        function showMessage(text, type) {
            const messagesDiv = document.getElementById('messages');
            const message = document.createElement('div');
            message.className = type;
            message.textContent = text;
            messagesDiv.appendChild(message);
            setTimeout(() => message.remove(), 3000);
        }

        // Load dashboard data
        async function loadDashboard() {
            loadAnalytics();
            loadWithdrawals();
        }

        // Load analytics
        async function loadAnalytics() {
            try {
                const response = await fetch(`${API_URL()}/api/admin/analytics`);
                const result = await response.json();

                if (result.success) {
                    const analytics = result.analytics;
                    document.getElementById('totalRevenue').textContent = analytics.totalRevenue.toLocaleString();
                    document.getElementById('analyticsContent').innerHTML = `
                        <div>Total Revenue: <strong>₹${analytics.totalRevenue.toLocaleString()}</strong></div>
                        <div>Total Payments: <strong>${analytics.totalPayments}</strong></div>
                        <div>Pending Withdrawals: <strong>₹${analytics.pendingWithdrawals.toLocaleString()}</strong></div>
                    `;

                    document.getElementById('paymentsContent').innerHTML = `
                        <div class="card-number">${analytics.totalPayments}</div>
                        <div>Total payments processed</div>
                    `;

                    if (analytics.topTeachers && analytics.topTeachers.length > 0) {
                        let teachersHtml = '<ol>';
                        analytics.topTeachers.forEach(teacher => {
                            teachersHtml += `<li>₹${(teacher.teacher_earn || 0).toLocaleString()}</li>`;
                        });
                        teachersHtml += '</ol>';
                        document.getElementById('teachersContent').innerHTML = teachersHtml;
                    }

                    document.getElementById('pendingCount').textContent = analytics.pendingWithdrawals > 0 ? '1+' : '0';
                }
            } catch (error) {
                console.error('Error loading analytics:', error);
                document.getElementById('analyticsContent').innerHTML = '<p style="color: red;">Error loading analytics. Is backend running?</p>';
            }
        }

        // Load withdrawals
        async function loadWithdrawals() {
            try {
                const response = await fetch(`${API_URL()}/api/admin/withdrawals`);
                const result = await response.json();

                if (result.success && result.data.length > 0) {
                    let html = '';
                    result.data.forEach(withdrawal => {
                        html += `
                            <div class="withdrawal-item">
                                <div class="withdrawal-info">
                                    <div class="teacher-name">Teacher ID: ${withdrawal.teacher_id.substring(0, 8)}...</div>
                                    <div class="amount">₹${withdrawal.amount.toLocaleString()}</div>
                                    <div class="status">Bank: ${withdrawal.bank_account_number}</div>
                                </div>
                                <div class="withdrawal-actions">
                                    <button class="btn btn-approve" onclick="approveWithdrawal('${withdrawal.id}')">Approve</button>
                                    <button class="btn btn-reject" onclick="rejectWithdrawal('${withdrawal.id}')">Reject</button>
                                </div>
                            </div>
                        `;
                    });
                    document.getElementById('withdrawalsContent').innerHTML = html;
                } else {
                    document.getElementById('withdrawalsContent').innerHTML = '<p style="text-align: center; color: #999; padding: 20px;">✅ No pending withdrawal requests</p>';
                }
            } catch (error) {
                console.error('Error loading withdrawals:', error);
                document.getElementById('withdrawalsContent').innerHTML = '<p style="color: red;">Error loading withdrawals</p>';
            }
        }

        // Approve withdrawal
        async function approveWithdrawal(withdrawalId) {
            if (!confirm('Approve this withdrawal?')) return;

            try {
                const response = await fetch(`${API_URL()}/api/admin/withdrawals/${withdrawalId}/approve`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ adminId: 'admin@leaarneasy.com' })
                });
                const result = await response.json();

                if (result.success) {
                    showMessage('✅ Withdrawal approved!', 'success');
                    loadWithdrawals();
                } else {
                    showMessage('❌ Error: ' + result.error, 'error');
                }
            } catch (error) {
                showMessage('❌ Error approving withdrawal', 'error');
            }
        }

        // Reject withdrawal
        async function rejectWithdrawal(withdrawalId) {
            if (!confirm('Reject this withdrawal?')) return;
            showMessage('⏳ Rejection feature coming soon', 'error');
        }

        // Auto-test backend on load
        window.addEventListener('load', () => {
            testBackend();
        });

        // Refresh data every 30 seconds
        setInterval(() => {
            loadDashboard();
        }, 30000);
    </script>
</body>
</html>
