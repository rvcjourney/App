buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 25
        compileSdkVersion = 35
        targetSdkVersion = 35
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.0.21"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

// Required for @videosdk.live/react-native-webrtc (AndroidUSBCamera)
// jiangdongguo 3.3.3 AARs are missing on JitPack; use chenyeju295 fork
allprojects {
    repositories {
        maven { url "https://repository.liferay.com/nexus/content/repositories/public/" }
        maven { url "https://www.jitpack.io" }
    }
    configurations.all {
        resolutionStrategy {
            dependencySubstitution {
                substitute(module("com.github.jiangdongguo.AndroidUSBCamera:libausbc")).using(module("com.github.chenyeju295.AndroidUSBCamera:libausbc:3.3.6"))
                substitute(module("com.github.jiangdongguo.AndroidUSBCamera:libuvc")).using(module("com.github.chenyeju295.AndroidUSBCamera:libuvc:3.3.6"))
                substitute(module("com.github.jiangdongguo.AndroidUSBCamera:libnative")).using(module("com.github.chenyeju295.AndroidUSBCamera:libnative:3.3.6"))
                substitute(module("com.github.jiangdongguo.AndroidUSBCamera:libuvccommon")).using(module("com.github.chenyeju295.AndroidUSBCamera:libuvccommon:3.3.6"))
            }
        }
    }
}
